<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    
    <!-- PWA Support -->
    <link rel="manifest" href="<%= BASE_URL %>manifest.json">
    <meta name="theme-color" content="#393939">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="L'Alternativa">
    
    <!-- Apple Touch Icons for iOS -->
    <link rel="apple-touch-icon" sizes="57x57" href="<%= BASE_URL %>icons/icon-72x72.png">
    <link rel="apple-touch-icon" sizes="60x60" href="<%= BASE_URL %>icons/icon-72x72.png">
    <link rel="apple-touch-icon" sizes="72x72" href="<%= BASE_URL %>icons/icon-72x72.png">
    <link rel="apple-touch-icon" sizes="76x76" href="<%= BASE_URL %>icons/icon-96x96.png">
    <link rel="apple-touch-icon" sizes="114x114" href="<%= BASE_URL %>icons/icon-128x128.png">
    <link rel="apple-touch-icon" sizes="120x120" href="<%= BASE_URL %>icons/icon-128x128.png">
    <link rel="apple-touch-icon" sizes="144x144" href="<%= BASE_URL %>icons/icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="<%= BASE_URL %>icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="<%= BASE_URL %>icons/icon-192x192.png">
    <link rel="apple-touch-icon" href="<%= BASE_URL %>icons/icon-192x192.png">
    
    <!-- Additional iOS meta tags -->
    <meta name="apple-touch-fullscreen" content="yes">
    <meta name="format-detection" content="telephone=no">
    <meta name="description" content="Pizzeria L'Alternativa - Order delicious pizzas and fritti online">
    
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <script src="https://kit.fontawesome.com/09712472f9.js" crossorigin="anonymous"></script>
    <title>L'Alternativa</title>
</head>
<body>
<noscript>
    <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled.
        Please enable it to continue.</strong>
</noscript>

</html>
